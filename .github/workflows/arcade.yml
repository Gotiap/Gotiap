name: Arcade

on:
  # Pick a new game every night and play it on the latest contribution graph
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: arcade
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Pick today's game
        id: pick
        run: |
          games=(snake pacman galaga breakout puzzle-bobble bomberman minesweeper space-shooter)
          game=${games[RANDOM % ${#games[@]}]}
          echo "Today's game: $game"
          echo "game=$game" >> "$GITHUB_OUTPUT"
          mkdir -p dist

      - name: Snake
        if: steps.pick.outputs.game == 'snake'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Arcade classics
        if: contains(fromJSON('["pacman","galaga","breakout","puzzle-bobble","bomberman","minesweeper"]'), steps.pick.outputs.game)
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: ${{ steps.pick.outputs.game }}

      - name: Space Shooter
        if: steps.pick.outputs.game == 'space-shooter'
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: dist/space-shooter.gif
          no-commit: "true"

      # The README has one fixed slot, so every game lands as game.svg / game-dark.svg.
      # Space Shooter only outputs a GIF, so it gets wrapped in an SVG to fit the same slot.
      - name: Stage today's game
        shell: python
        env:
          GAME: ${{ steps.pick.outputs.game }}
        run: |
          import base64, os, shutil, struct

          game = os.environ["GAME"]
          if game == "snake":
              light, dark = "dist/snake.svg", "dist/snake-dark.svg"
          elif game == "space-shooter":
              gif = open("dist/space-shooter.gif", "rb").read()
              w, h = struct.unpack("<HH", gif[6:10])
              data = base64.b64encode(gif).decode()
              with open("dist/space-shooter.svg", "w") as f:
                  f.write(
                      f'<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" '
                      f'width="{w}" height="{h}" viewBox="0 0 {w} {h}">'
                      f'<image width="{w}" height="{h}" xlink:href="data:image/gif;base64,{data}"/></svg>'
                  )
              light = dark = "dist/space-shooter.svg"
          else:
              light, dark = f"dist/{game}-contribution-graph.svg", f"dist/{game}-contribution-graph-dark.svg"
          shutil.copy(light, "dist/game.svg")
          shutil.copy(dark, "dist/game-dark.svg")

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect the 3D calendar
        run: mv profile-3d-contrib dist/3d

      # The radar, language donut and stars/forks panels only count public repos, and most of my work is private.
      # Keep just the 3D calendar, which counts everything.
      - name: Trim the 3D calendar
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET

          SVG = "http://www.w3.org/2000/svg"
          ET.register_namespace("", SVG)
          for path in glob.glob("dist/3d/*.svg"):
              tree = ET.parse(path)
              root = tree.getroot()
              for panel in [c for c in root if c.tag == f"{{{SVG}}}g"][1:]:
                  root.remove(panel)
              tree.write(path, encoding="unicode")

      # README reads everything from raw.githubusercontent.com/<owner>/<repo>/output/
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
