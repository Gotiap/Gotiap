  .rep1 { animation: rep 6s ease-in-out infinite; }
  .rep2 { animation: rep 6s ease-in-out 0.5s infinite; }
  .replabel { animation: rep 6s ease-in-out infinite; }
  @keyframes rep { 0%, 15%, 85%, 100% { opacity: 0; } 35%, 65% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .flow, .pulse, .rep1, .rep2, .replabel { animation: none; } }
</style>
